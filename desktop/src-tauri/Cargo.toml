[package]
name = "sentry-desktop"
version = "0.9.0"
description = "SENTRY — Guards Against Intrusions (desktop)"
authors = ["SENTRY contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "sentry_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
