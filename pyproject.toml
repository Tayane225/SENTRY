[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-guard"
version = "0.9.0"
description = "SENTRY — Guards Against Intrusions. AI-agent-orchestrated endpoint protection: detect, defend, restore."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SENTRY contributors" }]
keywords = ["antivirus", "malware", "security", "yara", "clamav", "mcp", "ai-agents", "endpoint-protection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=42",
  "psutil>=5.9",
  "pefile>=2023.2.7",
  "olefile>=0.46",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
full = ["yara-python>=4.3"]
dev = ["pytest>=8", "httpx>=0.27", "yara-python>=4.3"]

[project.scripts]
sentry = "sentry_engine.cli:main"
sentry-guard = "sentry_engine.cli:main"

[tool.setuptools.packages.find]
include = ["sentry_engine*"]

[tool.setuptools.package-data]
sentry_engine = ["store/schema.sql", "data/*.json", "rules/yara/*.yar", "rules/heuristics/*.json", "rules/allowlists/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running performance tests",
  "windows: requires Windows",
]
